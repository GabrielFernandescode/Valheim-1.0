<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valheim 1.0 — Contagem Regressiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="neve"></div>
    <div class="neblina"></div>

    <audio id="audio-ambiente" loop>
        <source src="valheim-tema.mp3" type="audio/mpeg">
    </audio>

    <main class="poster">
        <div class="runas">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</div>
        
        <h1>VALHEIM</h1>
        
        <p class="subtitulo">1.0</p>
        <p class="subtitulo">A JORNADA FINAL DOS PIA</p>
        
        <div class="divisor">✦ ───────── ✦</div>
        
        <section class="contador">
            <div class="bloco">
                <span id="dias" class="numero">00</span>
                <span class="legenda">DIAS</span>
            </div>
            <div class="separador">:</div>
            <div class="bloco">
                <span id="horas" class="numero">00</span>
                <span class="legenda">HORAS</span>
            </div>
            <div class="separador">:</div>
            <div class="bloco">
                <span id="minutos" class="numero">00</span>
                <span class="legenda">MINUTOS</span>
            </div>
            <div class="separador">:</div>
            <div class="bloco">
                <span id="segundos" class="numero">00</span>
                <span class="legenda">SEGUNDOS</span>
            </div>
        </section>

        <div class="versao">
            <span>───</span> 1.0 <span>───</span>
        </div>
        
        <div class="data">09 · 09 · 2026</div>
        
        <p class="mensagem">O DEEP NORTH NOS AGUARDA..</p>
        
        <div class="divisor inferior">✦ ───────── ✦</div>
        
        <div class="botoes-container">
            <button id="botao" class="botao">⚔ OUÇA O CHAMADO...</button>
            <button id="btn-players" class="botao">👥 PLAYERS</button>
        </div>
        <p id="status" class="status"></p>
    </main>

    <div id="modal-players" class="modal-oculto">
        <div class="modal-conteudo">
            <span id="fechar-modal" class="fechar">&times;</span>
            <h2>Viking Roster</h2>
            <table class="tabela-players">
                <thead>
                    <tr>
                        <th>Nick</th>
                        <th>Função</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>@SeuNickAqui</td>
                        <td> EM TESTE </td>
                    </tr>
                    <tr>
                        <td>@Amigo1</td>
                        <td> EM TESTE </td>
                    </tr>
                    <tr>
                        <td>@Amigo2</td>
                        <td>EM TESTE</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
