<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valheim 1.0 — Contagem Regressiva</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="tela-portal" class="tela-portal">
        <div class="portal-anel"></div>
        <div class="portal-conteudo">
            <h2 class="titulo-portal">Atravessar para o Deep North</h2>
            <input type="text" id="input-nick" class="input-viking" placeholder="Seu Nick (ex: @Odin)" autocomplete="off">
            <select id="input-funcao" class="input-viking">
                <option value="" disabled selected>Selecione sua Função na Base</option>
                <option value="Construtor">Construtor</option>
                <option value="Minerador">Minerador</option>
                <option value="Fazendeiro">Fazendeiro</option>
                <option value="Guerreiro">Guerreiro</option>
                <option value="Explorador">Explorador</option>
            </select>
            <button id="btn-entrar" class="botao">GO VALHEIM</button>
            <p id="erro-portal" class="status"></p>
        </div>
    </section>

    <div class="neve"></div>
    <div class="neblina"></div>
    

    <audio id="audio-ambiente" loop>
        <source src="valheim-tema.mp3" type="audio/mpeg">
    </audio>

    <audio id="audio-portal">
        <source src="portal-som.mp3" type="audio/mpeg">
    </audio>

    <main class="poster">
        <div class="runas">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ</div>
        
        <h1>VALHEIM</h1>
        
        <p class="subtitulo">1.0</p>
        <p class="subtitulo">A JORNADA FINAL DOS PIA</p>
        
        <div class="divisor">✦ ───────── ✦</div>
        
        <section class="contador">
            <div class="bloco">
                <span id="dias" class="numero">00</span>
                <span class="legenda">DIAS</span>
            </div>
            <div class="separador">:</div>
            <div class="bloco">
                <span id="horas" class="numero">00</span>
                <span class="legenda">HORAS</span>
            </div>
            <div class="separador">:</div>
            <div class="bloco">
                <span id="minutos" class="numero">00</span>
                <span class="legenda">MINUTOS</span>
            </div>
            <div class="separador">:</div>
            <div class="bloco">
                <span id="segundos" class="numero">00</span>
                <span class="legenda">SEGUNDOS</span>
            </div>
        </section>

        <div class="versao">
            <span>───</span> 1.0 <span>───</span>
        </div>
        
        <div class="data">09 · 09 · 2026</div>
        
        <p class="mensagem">O DEEP NORTH NOS AGUARDA..</p>
        
        <div class="divisor inferior">✦ ───────── ✦</div>
        
        <div class="botoes-container">
            <button id="botao" class="botao">⚔ OUÇA O CHAMADO...</button>
            <button id="btn-players" class="botao">👥 PLAYERS</button>
        </div>
        <p id="status" class="status"></p>
    </main>

    <div id="modal-players" class="modal-oculto">
        <div class="modal-conteudo">
            <span id="fechar-modal" class="fechar">&times;</span>
            <h2>Lista da Piazada</h2>
            <table class="tabela-players">
                <thead>
                    <tr>
                        <th>Nick</th>
                        <th>Função na Base</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
